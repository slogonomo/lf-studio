# Sol-H3 Studio as a spark-switchboard service (spark-switchboard, https://github.com/slogonomo/spark-switchboard:
# the companion on-demand app manager for one DGX Spark). Copy this file into your switchboard config's services/
# directory.
# Paths assume this repo is checked out at ~/src/sol-h3-studio; change the two "~/src/sol-h3-studio" paths in
# command and kill_command if not.
# Everything else (checkout, Python, runtime root, image) comes from ~/.config/sol-h3-studio/env.
title = "Sol-H3 Studio"
adapter = "web"
listen = 8190                            # public port; switchboard answers here
upstream = "http://127.0.0.1:18190"      # where the studio listens while switchboard runs it (env below)
memory_gib = 110                         # same as the launcher's SOLH3_MIN_FREE_GIB
max_gib = 117                            # a cap: it can grow to nearly the whole machine
priority = 10
idle_grace_s = 300
idle_stop_s = 1800                       # stop after 30 min unused
hold_s = 120
pidfile = "~/.local/state/sol-h3-studio/launcher.pid"
containers = ["sol-h3-qwen-*"]           # the Qwen prompt-encoder containers its pipeline starts
passive_paths = ["/health"]

[busy_probe]                             # busy while any job is queued or running
path = "/api/state"
list = "jobs"
field = "status"
idle_values = ["done", "failed", "cancelled"]   # a job's final statuses ("cancelled" since 0.3)

[run]
command = ["bash", "~/src/sol-h3-studio/bin/sol-h3-studio"]
# SOLH3_STOP_WAIT_S: the launcher gives the server 75 s to close its pipeline (it needs ~40 s), which leaves time
# for its own cleanup (workers, Qwen container) before switchboard's stop_timeout_s of 90 s runs out
env = { SOLH3_PORT = "18190", SOLH3_HOST = "127.0.0.1", SOLH3_PIDFILE = "~/.local/state/sol-h3-studio/launcher.pid", SOLH3_STOP_WAIT_S = "75" }
stop_timeout_s = 90                      # the server closes its pipeline (workers, Qwen container) in up to ~40 s
# after a SIGKILL of the launcher's process group: kill the server, the pipeline workers (own sessions) and
# remove the Qwen containers; the launcher reads the package path from its env file
kill_command = ["bash", "~/src/sol-h3-studio/bin/sol-h3-studio", "--kill"]

[ready]
path = "/health"
estimate_s = 10
